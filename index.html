<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCMAPSLIVE — Тактический Центр</title>
    <!-- Подключение стабильной версии Firebase SDK v8 -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root {
            --mac-bg: #1e1e1e;
            --mac-border: rgba(255, 255, 255, 0.15);
            --mac-text: #f5f5f7;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2a2e3d, #090a0f);
            color: var(--mac-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Верхняя служебная строка меню macOS */
        .mac-menubar {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }
        .menu-left { display: flex; gap: 16px; font-weight: 600; }
        .menu-right { color: #27c93f; font-size: 12px; font-weight: bold; }

        /* Системное окно macOS */
        .mac-window {
            background: var(--mac-bg);
            border: 1px solid var(--mac-border);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            width: 96vw;
            max-width: 1400px;
            height: calc(100vh - 145px);
            margin: 15px auto 0 auto;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Адаптивная шапка окна, защищенная от наложения элементов */
        .mac-titlebar {
            background: #262626;
            min-height: 44px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            box-sizing: border-box;
            gap: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            position: relative;
        }
        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mac-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }
        
        .window-title {
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .auth-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mac-input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .mac-input:focus {
            border-color: #ffa500;
        }
        .status-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 170, 255, 0.15);
            color: #00aaff;
            border: 1px solid rgba(0, 170, 255, 0.3);
            font-weight: bold;
            white-space: nowrap;
        }

        /* Рабочее пространство холста */
        .window-content {
            flex: 1;
            background: #111411;
            position: relative;
            overflow: hidden;
        }
        .map-viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        #mapCanvas {
            position: absolute;
            transform-origin: 0 0;
        }

        /* Док-панель инструментов Touchbar-style */
        .mac-dock {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            width: calc(100% - 32px);
            max-width: fit-content;
            box-sizing: border-box;
        }

        .dock-item {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--mac-text);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .dock-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }
        .dock-color {
            width: 30px;
            height: 30px;
            border: none;
            padding: 0;
            background: none;
            cursor: pointer;
        }
        .dock-slider { width: 70px; cursor: pointer; }
        
        #leaderMapUrl {
            width: 200px;
            display: none; /* Скрыто для зрителей */
        }

        /* Адаптивность для мобильных экранов */
        @media (max-width: 480px) {
            .mac-titlebar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 8px;
            }
            .auth-zone {
                width: 100%;
                justify-content: space-between;
            }
            .mac-window {
                height: calc(100vh - 185px);
            }
        }
    </style>
</head>
<body>

    <div class="mac-menubar">
        <div class="menu-left">
            <span></span>
            <span>SCMAPSLIVE</span>
        </div>
        <div class="menu-right" id="onlineIndicator">Сеть: Подключение...</div>
    </div>

    <div class="mac-window">
        <div class="mac-titlebar">
            <div class="titlebar-left">
                <div class="mac-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <div class="window-title">SCMAPSLIVE</div>
            </div>
            
            <div class="auth-zone">
                <span id="roleLabel" class="status-badge">Зритель 👁️</span>
                <input type="password" id="leaderPass" class="mac-input" placeholder="Пароль Лидера" style="width: 110px;">
                <button id="loginBtn" class="dock-item" style="padding: 5px 10px;">Войти</button>
            </div>
        </div>

        <div class="window-content">
            <div class="map-viewport" id="viewport">
                <canvas id="mapCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="mac-dock">
        <input type="text" id="leaderMapUrl" class="mac-input" placeholder="Прямая ссылка на карту...">
        <button id="modeBtn" class="dock-item">✏️ Рисовать</button>
        <input type="color" id="colorPicker" class="dock-color" value="#ff0000">
        <input type="range" id="brushSize" class="dock-slider" min="2" max="15" value="5">
        <button id="eraserBtn" class="dock-item">🧹 Ластик</button>
        <button id="clearBtn" class="dock-item" style="background:#702222; border-color:#8c3030;">💥 Сброс</button>
        <button id="saveBtn" class="dock-item" style="background:#227035; border-color:#308c43;">💾 Скачать</button>
    </div>
    <script>
        // --- 100% ПРАВИЛЬНЫЙ И ПОЛНЫЙ КОНФИГУРАЦИОННЫЙ БЛОК FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlpgpurJx8dEwBDWpkXSIjUYaUh-r7xNE",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "clanwars-arms",
            storageBucket: "clanwars-arms.firebasestorage.app",
            messagingSenderId: "636686968167",
            appId: "1:636686968167:web:e5cbfe652bd3cb41117bc2",
            measurementId: "G-76KVGNN87L"
        };
        
        // Старт базы данных с защитой от вылета страницы
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (error) {
            document.getElementById('onlineIndicator').textContent = "Критическая ошибка конфигурации!";
            document.getElementById('onlineIndicator').style.color = "#ff5f56";
            console.error(error);
        }

        // Сбор элементов интерфейса
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');
        const modeBtn = document.getElementById('modeBtn');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveBtn = document.getElementById('saveBtn');
        const leaderPass = document.getElementById('leaderPass');
        const loginBtn = document.getElementById('loginBtn');
        const roleLabel = document.getElementById('roleLabel');
        const onlineIndicator = document.getElementById('onlineIndicator');
        const leaderMapUrl = document.getElementById('leaderMapUrl');

        let isLeader = false;
        let currentMapUrl = '';
        const mapBg = new Image();

        let scale = 1; let offsetX = 0; let offsetY = 0;
        let appMode = 'draw'; let isEraser = false;
        let isDrawing = false; let isPanning = false;
        let startX = 0, startY = 0; let lastDrawX = 0, lastDrawY = 0; let touchStartDist = 0;
        let drawnLines = [];

        // Вход для лидера (Пароль: lidakyeldak)
        loginBtn.addEventListener('click', () => {
            const pass = leaderPass.value.trim();
            
            if (pass === "lidakyeldak") { 
                isLeader = true;
                roleLabel.textContent = "Лидер 👑";
                roleLabel.style.background = "rgba(39, 201, 63, 0.2)";
                roleLabel.style.color = "#27c93f";
                roleLabel.style.borderColor = "rgba(39, 201, 63, 0.4)";
                leaderPass.style.display = "none";
                loginBtn.style.display = "none";
                leaderMapUrl.style.display = "block"; 
                if (db) onlineIndicator.textContent = "Трансляция SCMAPSLIVE";
            } else {
                alert("Неверный тактический ключ доступа!");
            }
        });

        // Контроль сетевого статуса подключения к серверу Realtime Database
        if (db) {
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    onlineIndicator.textContent = isLeader ? "Трансляция SCMAPSLIVE" : "Наблюдение SCMAPSLIVE";
                    onlineIndicator.style.color = "#27c93f";
                } else {
                    onlineIndicator.textContent = "Переподключение...";
                    onlineIndicator.style.color = "#ff5f56";
                }
            });

            // Сетевой прием ссылки на карту, установленной лидером
            db.ref('dynamic_clan_map_url').on('value', (snapshot) => {
                const remoteUrl = snapshot.val();
                if (remoteUrl && remoteUrl !== currentMapUrl) {
                    currentMapUrl = remoteUrl;
                    if (remoteUrl.startsWith('http')) {
                        mapBg.crossOrigin = "anonymous";
                    } else {
                        mapBg.removeAttribute("crossOrigin");
                    }
                    mapBg.src = remoteUrl;
                    if (!isLeader) leaderMapUrl.value = remoteUrl;
                }
            });

            // Отправка ссылки лидером на сервер при её изменении
            leaderMapUrl.addEventListener('change', (e) => {
                if (!isLeader) return;
                const newUrl = e.target.value.trim();
                if (newUrl) {
                    db.ref('dynamic_clan_map_url').set(newUrl);
                    db.ref('clan_canvas_lines').remove(); 
                }
            });

            // Потоковый прием векторов рисования лидера из базы
            db.ref('clan_canvas_lines').on('value', (snapshot) => {
                const data = snapshot.val();
                drawnLines = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        drawnLines.push(data[key]);
                    });
                }
                redrawAll();
            });
        }

        // Логика тач-событий (смартфоны)
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && appMode === 'draw') {
                if (!isLeader) return; 
                isDrawing = true;
                const [cx, cy] = getCanvasCoords(e.touches.clientX, e.touches.clientY);
                [lastDrawX, lastDrawY] = [cx, cy];
            } else if (e.touches.length === 2) {
                isDrawing = false;
                isPanning = true;
                const p1 = e.touches[0];
                const p2 = e.touches[1];
                const midX = (p1.clientX + p2.clientX) / 2;
                const midY = (p1.clientY + p2.clientY) / 2;
                startX = midX - offsetX;
                startY = midY - offsetY;
                touchStartDist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
            } else if (appMode === 'pan' && e.touches.length === 1) {
                isPanning = true;
                startX = e.touches[0].clientX - offsetX;
                startY = e.touches[0].clientY - offsetY;
            }
        }, { passive: true });
        viewport.addEventListener('touchmove', (e) => {
            if (isDrawing && e.touches.length === 1 && isLeader) {
                const [cx, cy] = getCanvasCoords(e.touches.clientX, e.touches.clientY);
                
                const lineData = {
                    x1: lastDrawX, y1: lastDrawY,
                    x2: cx, y2: cy,
                    color: colorPicker.value,
                    size: parseInt(brushSize.value),
                    mode: isEraser ? 'erase' : 'draw'
                };
                
                if (db) db.ref('clan_canvas_lines').push(lineData);
                [lastDrawX, lastDrawY] = [cx, cy];
            } else if (isPanning && e.touches.length === 2) {
                const p1 = e.touches;
                const p2 = e.touches;
                const currentDist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                const midX = (p1.clientX + p2.clientX) / 2;
                const midY = (p1.clientY + p2.clientY) / 2;

                const factor = currentDist / touchStartDist;
                touchStartDist = currentDist;

                scale = Math.max(0.1, Math.min(scale * factor, 8));
                offsetX = midX - startX * factor;
                offsetY = midY - startY * factor;
                
                startX = midX - offsetX;
                startY = midY - offsetY;

                updateTransform();
            } else if (isPanning && appMode === 'pan' && e.touches.length === 1) {
                offsetX = e.touches.clientX - startX;
                offsetY = e.touches.clientY - startY;
                updateTransform();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            isDrawing = false;
            isPanning = false;
        });

        // Обработка мыши (ПК)
        viewport.addEventListener('mousedown', (e) => {
            if (appMode === 'draw' && e.button === 0 && isLeader) {
                isDrawing = true;
                const [cx, cy] = getCanvasCoords(e.clientX, e.clientY);
                [lastDrawX, lastDrawY] = [cx, cy];
            } else if (appMode === 'pan' || e.button === 1 || e.button === 2) {
                isPanning = true;
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
            }
        });

        viewport.addEventListener('mousemove', (e) => {
            if (isDrawing && isLeader) {
                const [cx, cy] = getCanvasCoords(e.clientX, e.clientY);
                const lineData = {
                    x1: lastDrawX, y1: lastDrawY,
                    x2: cx, y2: cy,
                    color: colorPicker.value,
                    size: parseInt(brushSize.value),
                    mode: isEraser ? 'erase' : 'draw'
                };
                if (db) db.ref('clan_canvas_lines').push(lineData);
                [lastDrawX, lastDrawY] = [cx, cy];
            } else if (isPanning) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
            isPanning = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const mouseX = e.clientX - viewport.getBoundingClientRect().left;
            const mouseY = e.clientY - viewport.getBoundingClientRect().top;
            const canvasMouseX = (mouseX - offsetX) / scale;
            const canvasMouseY = (mouseY - offsetY) / scale;

            if (e.deltaY < 0) scale = Math.min(scale * zoomFactor, 8);
            else scale = Math.max(scale / zoomFactor, 0.1);

            offsetX = mouseX - canvasMouseX * scale;
            offsetY = mouseY - canvasMouseY * scale;
            updateTransform();
        }, { passive: false });

        viewport.addEventListener('contextmenu', e => e.preventDefault());

        mapBg.onload = function() {
            canvas.width = mapBg.naturalWidth || 1024;
            canvas.height = mapBg.naturalHeight || 1024;
            resetView();
            redrawAll();
        };

        mapBg.onerror = function() {
            drawFallback();
        };

        function drawFallback() {
            canvas.width = 1024;
            canvas.height = 1024;
            ctx.fillStyle = '#121612';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(39, 201, 63, 0.12)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('SCMAPSLIVE: ОЖИДАНИЕ КАРТЫ ОТ ЛИДЕРА...', 512, 512);
        }

        function redrawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (mapBg.complete && mapBg.naturalWidth !== 0) {
                ctx.drawImage(mapBg, 0, 0, canvas.width, canvas.height);
            } else {
                drawFallback();
            }

            drawnLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                if (line.mode === 'erase') {
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.arc(line.x2, line.y2, line.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(line.x2, line.y2, line.size * 2, 0, Math.PI * 2);
                    ctx.clip();
                    if (mapBg.complete && mapBg.naturalWidth !== 0) ctx.drawImage(mapBg, 0, 0, canvas.width, canvas.height);
                    else drawFallback();
                    ctx.restore();
                } else {
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = line.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                }
            });
        }

        function updateTransform() {
            canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        }

        function resetView() {
            scale = Math.min(viewport.clientWidth / canvas.width, viewport.clientHeight / canvas.height) * 0.95;
            offsetX = (viewport.clientWidth - canvas.width * scale) / 2;
            offsetY = (viewport.clientHeight - canvas.height * scale) / 2;
            updateTransform();
        }

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return [
                (clientX - rect.left) / scale,
                (clientY - rect.top) / scale
            ];
        }

        // Кнопки док-панели
        modeBtn.addEventListener('click', () => {
            if (appMode === 'draw') {
                appMode = 'pan';
                modeBtn.textContent = '🖐️ Движение';
                modeBtn.style.backgroundColor = '#9e6a14';
            } else {
                appMode = 'draw';
                modeBtn.textContent = '✏️ Рисовать';
                modeBtn.style.backgroundColor = '#2b4c7e';
            }
        });

        eraserBtn.addEventListener('click', () => {
            isEraser = !isEraser;
            eraserBtn.style.backgroundColor = isEraser ? '#ffbd2e' : 'rgba(255,255,255,0.08)';
            eraserBtn.style.color = isEraser ? '#000' : '#fff';
        });

        clearBtn.addEventListener('click', () => {
            if (!isLeader) {
                alert("Только Лидер может полностью очищать глобальный холст!");
                return;
            }
            if (confirm('Очистить тактическую разметку на сервере для всех участников?')) {
                if (db) db.ref('clan_canvas_lines').remove();
            }
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `scmapslive_plan.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        drawFallback();
        window.addEventListener('resize', resetView);
    </script>
</body>
</html>
