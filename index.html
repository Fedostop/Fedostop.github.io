<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хвойный — Карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #121212; }
        #map { height: 100vh; width: 100%; background: #1a1a1a; }
        
        /* Стили для маркеров */
        .custom-marker {
            background: #333;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 26px; height: 26px;
            text-align: center; line-height: 26px;
            color: white; font-weight: bold; font-family: sans-serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            font-size: 14px;
        }
        .marker-base-blue { background: #00bfff; border-color: #00bfff; }
        .marker-base-red { background: #ff3333; border-color: #ff3333; }
        .marker-a, .marker-b, .marker-c { background: #f0f0f0; color: black; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ВАЖНО: Размеры твоего скриншота (примерно 784x586)
        // Если картинка растянется неправильно, поменяй эти цифры на реальные (в пикселях)
        var imgWidth = 784;
        var imgHeight = 586;
        
        // Границы карты
        var bounds = [[0, 0], [imgHeight, imgWidth]];

        // Инициализация карты
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        // Добавляем картинку на фон
        // Убедись, что файл называется hvoiny.png и лежит рядом с index.html
        var image = L.imageOverlay('hvoiny.png', bounds).addTo(map);
        
        // Подгоняем вид под размер картинки
        map.fitBounds(bounds);

        // --- ФУНКЦИЯ ДЛЯ МАРКЕРОВ ---
        // xPercent и yPercent: от 0 до 100 (где 0 - левый/верхний край, 100 - правый/нижний)
        function addMarker(name, xPercent, yPercent, iconClass, popupText) {
            var x = (xPercent / 100) * imgWidth;
            var y = (yPercent / 100) * imgHeight;
            
            // Инверсия Y для Leaflet
            var latLng = [imgHeight - y, x];

            var icon = L.divIcon({
                className: 'custom-marker ' + iconClass,
                html: name,
                iconSize: [26, 26],
                iconAnchor: [13, 13]
            });

            L.marker(latLng, { icon: icon }).addTo(map).bindPopup(popupText);
        }

        // --- РАССТАНОВКА ТОЧЕК ---
        // Я рассчитал проценты на основе твоего скриншота:
        
        // Синяя база (верх)
        addMarker('⚑', 50, 10, 'marker-base-blue', '<b>Синяя База</b>');
        
        // Точка А
        addMarker('A', 20, 50, 'marker-a', '<b>Точка А</b>');
        
        // Точка B
        addMarker('B', 50, 50, 'marker-b', '<b>Точка B</b>');
        
        // Точка C
        addMarker('C', 81, 50, 'marker-c', '<b>Точка C</b>');
        
        // Красная база (низ)
        addMarker('⚐', 50, 89, 'marker-base-red', '<b>Красная База</b>');

    </script>
</body>
</html>
